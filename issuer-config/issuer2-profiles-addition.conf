# Add this entry inside the `profiles = { ... }` block of:
#   waltid-identity/docker-compose/issuer-api2/config/issuer2-profiles.conf
#   (the docker-compose bind mount reads THIS copy; edits under
#    waltid-services/... are silently ignored)
#
# It reuses the file's existing `defaultIssuerKey` / `defaultIssuerDid`
# (the ones the shipped default profiles already reference) via HOCON
# substitution, so you don't need to generate your own keys for this demo.

"university-diploma" = {
  name = "University Diploma"
  credentialConfigurationId = "UniversityDiploma_jwt_vc_json"
  issuerKey = ${defaultIssuerKey}
  issuerDid = ${defaultIssuerDid}

  credentialData = {
    "@context" = ["https://www.w3.org/2018/credentials/v1"]
    type = ["VerifiableCredential", "UniversityDiploma"]
    credentialSubject = {
      studentName = "Jane Doe"
      degree = "Bachelor of Science in Computer Science"
      graduationDate = "2026-06-15"
      gpa = "3.8"
    }
  }

  # Fields the issuer fills in dynamically at issuance time.
  # NOTE: use nested objects here. A quoted dotted key such as
  # "issuer.id" is a LITERAL key in HOCON, not a path, so it would never
  # reach issuer.id in the credential.
  mapping = {
    id = "<uuid>"
    issuer = { id = "<issuerDid>" }
    credentialSubject = { id = "<subjectDid>" }
    issuanceDate = "<timestamp>"
  }
}
