# Add this entry inside the `credentialConfigurations = { ... }` block of:
#   waltid-identity/docker-compose/issuer-api2/config/credential-issuer-metadata.conf
#   (the docker-compose bind mount reads THIS copy; edits under
#    waltid-services/... are silently ignored)

"UniversityDiploma_jwt_vc_json" = {
  format = "jwt_vc_json"
  scope = "UniversityDiploma_jwt_vc_json"
  cryptographic_binding_methods_supported = ["did:key", "did:jwk"]
  credential_signing_alg_values_supported = ["ES256", "EdDSA"]
  proof_types_supported = {
    jwt = {
      proof_signing_alg_values_supported = ["ES256", "EdDSA"]
    }
  }
  credential_definition = {
    type = ["VerifiableCredential", "UniversityDiploma"]
  }
  display = [
    {
      name = "University Diploma"
      locale = "en-US"
      background_color = "#1b2a4a"
      text_color = "#FFFFFF"
      description = "Verifiable proof of degree conferral"
    }
  ]
}
