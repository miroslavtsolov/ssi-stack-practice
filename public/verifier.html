<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Verifier — Employer</title>
<script src="qrcode.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #1b2a4a; }
  button { background: #1b2a4a; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; margin-right: 8px; }
  button:hover { opacity: 0.9; }
  button:disabled { background: #aaa; color: #eee; cursor: not-allowed; opacity: 0.6; }
  #qr { margin-top: 20px; }
  textarea { width: 100%; box-sizing: border-box; height: 70px; margin-top: 12px; font-family: monospace; font-size: 0.8rem; }
  pre { background: #f4f4f4; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; }
  .muted { color: #666; font-size: 0.85rem; }
  a.back { font-size: 0.85rem; }
  .status-ok { color: #147a3d; font-weight: bold; }
  .status-pending { color: #a15c00; }
</style>
</head>
<body>
  <a class="back" href="/">&larr; back</a>
  <h1>🏢 Verifier — Employer</h1>
  <p class="muted">Requests a <code>UniversityDiploma</code> via a DCQL query and checks the signature policy.</p>

  <button id="createBtn">Create Verification Request</button>
  <div id="status" class="muted"></div>
  <div id="qr"></div>
  <textarea id="reqText" readonly placeholder="Request URL will appear here (paste into the wallet page)"></textarea>

  <div>
    <button id="pollBtn" disabled>Check Result</button>
    <span id="pollStatus" class="muted"></span>
  </div>
  <pre id="resultJson"></pre>

  <script>
    // sessionStorage survives reloads/back-navigation within the tab.
    let sessionId = null;
    try { sessionId = sessionStorage.getItem("demo_verifierSessionId"); } catch {}
    const statusEl = document.getElementById("status");
    const qrEl = document.getElementById("qr");
    const reqText = document.getElementById("reqText");
    const pollBtn = document.getElementById("pollBtn");
    const pollStatus = document.getElementById("pollStatus");
    const resultJson = document.getElementById("resultJson");

    document.getElementById("createBtn").addEventListener("click", async () => {
      statusEl.textContent = "Creating session...";
      qrEl.innerHTML = "";
      resultJson.textContent = "";
      try {
        const res = await fetch("/api/verifier/session", { method: "POST" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || JSON.stringify(data));

        sessionId = data.sessionId;
        try { sessionStorage.setItem("demo_verifierSessionId", sessionId); } catch {}
        window.__debugSessionId = sessionId; // inspect anytime via console: window.__debugSessionId
        // Enable the poll button immediately, before anything else that could throw
        // (QR rendering, DOM updates) has a chance to block it.
        pollBtn.disabled = false;
        console.log("Session created, pollBtn.disabled now =", pollBtn.disabled);
        reqText.value = data.bootstrapAuthorizationRequestUrl;
        try {
          new QRCode(qrEl, { text: data.bootstrapAuthorizationRequestUrl, width: 220, height: 220, typeNumber: 0, correctLevel: QRCode.CorrectLevel.L });
        } catch (qrErr) {
          console.error("QR render failed (non-fatal, URL text still available above):", qrErr);
        }
        statusEl.textContent = `Session ${sessionId} created. Scan the QR with a wallet, or paste the URL into the wallet's "Present a credential" box.`;
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
        console.error(err);
      }
    });

    if (sessionId) {
      pollBtn.disabled = false;
      statusEl.textContent = `Restored session ${sessionId}. Create a new request to start over.`;
    }

    pollBtn.addEventListener("click", async () => {
      console.log("Check Result clicked, sessionId =", sessionId);
      if (!sessionId) {
        pollStatus.textContent = "No session yet — click Create Verification Request first.";
        return;
      }
      pollStatus.textContent = "Checking...";
      try {
        const res = await fetch(`/api/verifier/session/${sessionId}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || JSON.stringify(data));

        const ok = data.status === "SUCCESSFUL" && data.policy_results?.overallSuccess;
        pollStatus.textContent = data.status;
        pollStatus.className = ok ? "status-ok" : "status-pending";
        resultJson.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        pollStatus.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
