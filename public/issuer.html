<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Issuer — University</title>
<script src="qrcode.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #1b2a4a; }
  button { background: #1b2a4a; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
  button:hover { opacity: 0.9; }
  #qr { margin-top: 20px; }
  textarea { width: 100%; height: 70px; margin-top: 12px; font-family: monospace; font-size: 0.8rem; }
  .muted { color: #666; font-size: 0.85rem; }
  a.back { font-size: 0.85rem; }
</style>
</head>
<body>
  <a class="back" href="/">&larr; back</a>
  <h1>🏛️ Issuer — University</h1>
  <p class="muted">Issues a <code>UniversityDiploma</code> credential from the <code>university-diploma</code> profile via <code>PRE_AUTHORIZED</code> OID4VCI.</p>
  <button id="issueBtn">Issue Diploma Credential</button>
  <div id="status" class="muted"></div>
  <div id="qr"></div>
  <textarea id="offerText" readonly placeholder="Offer URL will appear here"></textarea>

  <script>
    const statusEl = document.getElementById("status");
    const qrEl = document.getElementById("qr");
    const offerText = document.getElementById("offerText");

    document.getElementById("issueBtn").addEventListener("click", async () => {
      statusEl.textContent = "Creating offer...";
      qrEl.innerHTML = "";
      offerText.value = "";
      try {
        const res = await fetch("/api/issuer/offer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ profileId: "university-diploma", authMethod: "PRE_AUTHORIZED" }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || JSON.stringify(data));

        offerText.value = data.credentialOffer;
        try {
          // typeNumber 0 + level L gives the largest capacity qrcodejs offers.
          new QRCode(qrEl, { text: data.credentialOffer, width: 220, height: 220, typeNumber: 0, correctLevel: QRCode.CorrectLevel.L });
        } catch (qrErr) {
          console.error("QR render failed (non-fatal, URL text still available below):", qrErr);
          qrEl.textContent = "QR code unavailable (URL too long) - copy the URL below.";
        }
        statusEl.textContent = `Offer created (expires ${new Date(data.expiresAt).toLocaleTimeString()}). Scan the QR with a wallet, or paste this URL into the wallet page.`;
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
